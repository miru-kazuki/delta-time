<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="godot-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#478cbf" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6bb3e8" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="unity-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#888888" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#aaaaaa" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="godot-area-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#478cbf" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#478cbf" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#121212"/>
  <rect x="60" y="70" width="680" height="440" fill="#181818" rx="4" stroke="#282828" stroke-width="1"/>

  <!-- Title & Subtitle -->
  <text x="60" y="42" fill="#f0f0f0" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="0.5">FRAME TIME DYNAMICS (3D SPONZA 100K TRIS)</text>
  <text x="740" y="42" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="end">1080p Vulkan vs URP</text>

  <!-- Grid Lines & Y-axis labels -->
  <!-- 16.6ms (60 FPS) -->
  <line x1="60" y1="130" x2="740" y2="130" stroke="#2a2a2a" stroke-dasharray="4,4" stroke-width="1"/>
  <text x="50" y="134" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">16.6ms</text>
  <text x="730" y="124" fill="#555555" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">60 FPS Target</text>

  <!-- 11.1ms (90 FPS) -->
  <line x1="60" y1="230" x2="740" y2="230" stroke="#262626" stroke-width="1"/>
  <text x="50" y="234" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">11.1ms</text>

  <!-- 8.3ms (120 FPS) -->
  <line x1="60" y1="330" x2="740" y2="330" stroke="#2a2a2a" stroke-dasharray="4,4" stroke-width="1"/>
  <text x="50" y="334" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">8.3ms</text>
  <text x="730" y="324" fill="#555555" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">120 FPS Target</text>

  <!-- 6.9ms (144 FPS) -->
  <line x1="60" y1="430" x2="740" y2="430" stroke="#262626" stroke-width="1"/>
  <text x="50" y="434" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">6.9ms</text>

  <!-- Base Line (0ms) -->
  <line x1="60" y1="510" x2="740" y2="510" stroke="#383838" stroke-width="1.5"/>

  <!-- Unity 2024 Curve (avg ~7.81ms / 128 FPS, very consistent) -->
  <!-- y around 350-380 -->
  <path d="M 60,370 Q 110,366 160,374 T 260,368 T 360,372 T 460,369 T 560,373 T 660,367 T 740,371" 
        fill="none" stroke="url(#unity-line-grad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Godot 4.3 Area fill -->
  <path d="M 60,420 Q 110,412 160,426 T 260,415 T 320,310 T 360,424 T 460,418 T 560,422 T 660,416 T 740,420 L 740,510 L 60,510 Z" 
        fill="url(#godot-area-grad)"/>

  <!-- Godot 4.3 Curve (avg ~7.04ms / 142 FPS, minor shader spike at ~320px) -->
  <path d="M 60,420 Q 110,412 160,426 T 260,415 T 320,310 T 360,424 T 460,418 T 560,422 T 660,416 T 740,420" 
        fill="none" stroke="url(#godot-line-grad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Annotation for Godot spike -->
  <circle cx="320" cy="310" r="4" fill="#478cbf"/>
  <line x1="320" y1="300" x2="320" y2="260" stroke="#478cbf" stroke-width="1" stroke-dasharray="2,2"/>
  <rect x="240" y="235" width="160" height="24" fill="#202a35" rx="3" stroke="#478cbf" stroke-width="1"/>
  <text x="320" y="251" fill="#c4e2ff" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Shader compilation spike</text>

  <!-- X-axis Time labels -->
  <text x="60" y="535" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="11">0s</text>
  <text x="230" y="535" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="11">15s</text>
  <text x="400" y="535" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="11">30s</text>
  <text x="570" y="535" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="11">45s</text>
  <text x="740" y="535" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">60s</text>

  <!-- Legend -->
  <g transform="translate(60, 560)">
    <!-- Godot item -->
    <rect x="0" y="4" width="20" height="4" fill="#478cbf" rx="2"/>
    <text x="28" y="11" fill="#e0e0e0" font-family="'Inter', sans-serif" font-size="12" font-weight="500">Godot 4.3 Forward+</text>
    <text x="160" y="11" fill="#478cbf" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">142 FPS (7.04ms)</text>

    <!-- Unity item -->
    <rect x="340" y="4" width="20" height="4" fill="#888888" rx="2"/>
    <text x="368" y="11" fill="#e0e0e0" font-family="'Inter', sans-serif" font-size="12" font-weight="500">Unity 2024 URP</text>
    <text x="480" y="11" fill="#aaaaaa" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">128 FPS (7.81ms)</text>
  </g>
</svg>
